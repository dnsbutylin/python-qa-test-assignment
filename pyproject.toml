[tool.pytest.ini_options]
addopts = "-v --tb=short --alluredir=allure-results --clean-alluredir"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "defect: тест падает, потому что воспроизводит дефект класса Pen",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
